<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Soundify - Music</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="logo">S</div>

        <div class="brand">

            <h1>Music</h1>

            <p>50+ songs for you</p>

        </div>

        <button class="back-btn"
                onclick="location.href='index.html'">

            ← Back

        </button>

    </header>


    <!-- NAV -->

    <nav class="tabs">

        <button onclick="location.href='index.html'">
            All
        </button>

        <button class="active">
            🎵 Music
        </button>

        <button onclick="location.href='podcast.html'">
            🎙 Podcasts
        </button>

    </nav>


    <!-- MUSIC -->

    <main class="music-page">

        <h2>All Songs</h2>

        <p class="subtitle">
            55 songs available
        </p>


        <div id="musicList"
             class="music-list">

        </div>

    </main>


    <!-- PLAYER -->

    <div class="player">


        <!-- CURRENT SONG -->

        <div class="now">

            <div class="mini-art">
                ♫
            </div>

            <div>

                <h4 id="currentTitle">
                    Select a song
                </h4>

                <p id="currentArtist">
                    Artist
                </p>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="buttons">

                <button onclick="previousSong()">
                    ⏮
                </button>

                <button class="main-play"
                        onclick="playPause()">

                    ▶

                </button>

                <button onclick="nextSong()">
                    ⏭
                </button>

            </div>


            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- VOLUME -->

        <div class="volume">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.7"
            >

        </div>

    </div>


</div>


<audio id="audio"></audio>


<script src="script.js"></script>

</body>

</html>
